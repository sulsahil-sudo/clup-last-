<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدوري السعودي للمحترفين</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    .active-tab { background-color: #1e3a8a !important; color: white !important; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- عنوان الموقع العلوي -->
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-blue-900 flex items-center justify-center gap-2">
      ⚽ الدوري السعودي للمحترفين
    </h1>
  </div>

  <!-- شريط التنقل العلوي -->
  <div class="max-w-6xl mx-auto bg-white p-3 rounded-xl shadow mb-6 flex flex-wrap gap-2 justify-end border">
    <button onclick="switchTab('standings-tab', this)" class="tab-btn px-5 py-2 rounded-lg font-bold text-gray-700 transition">الترتيب</button>
    <button onclick="switchTab('players-tab', this)" class="tab-btn px-5 py-2 rounded-lg font-bold text-gray-700 transition">اللاعبون</button>
    <button onclick="switchTab('matches-tab', this)" class="tab-btn active-tab px-5 py-2 rounded-lg font-bold text-gray-750 transition">المباريات</button>
    <button onclick="switchTab('scorers-tab', this)" class="tab-btn px-5 py-2 rounded-lg font-bold text-gray-700 transition">⚽ الهدافين</button>
  </div>

  <div class="max-w-6xl mx-auto">

    <!-- 1. تبويب الترتيب -->
    <div id="standings-tab" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="bg-blue-900 text-white p-4 font-bold text-lg text-center">جدول ترتيب دوري روشن السعودي</div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-right">
            <thead class="bg-gray-100 text-gray-700">
              <tr>
                <th class="p-3">#</th>
                <th class="p-3">الفريق</th>
                <th class="p-3 text-center">لعب</th>
                <th class="p-3 text-center">فاز</th>
                <th class="p-3 text-center">تعادل</th>
                <th class="p-3 text-center">خسر</th>
                <th class="p-3 text-center">له</th>
                <th class="p-3 text-center">عليه</th>
                <th class="p-3 text-center">الفرق</th>
                <th class="p-3 text-center font-bold">النقاط</th>
              </tr>
            </thead>
            <tbody id="standings-list" class="divide-y"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 2. تبويب المباريات بتصميم بطاقات العِداد التنازلي -->
    <div id="matches-tab" class="tab-content">
      <div id="matches-list" class="grid gap-4"></div>
    </div>

    <!-- 3. تبويب الهدافين والإحصائيات -->
    <div id="scorers-tab" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="bg-blue-900 text-white p-4 text-center font-bold text-lg shadow">
          ⚽ هدافو دوري روشن السعودي وإحصائيات اللاعبين
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-right border-collapse">
            <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
              <tr>
                <th class="p-3">#</th>
                <th class="p-3">اللاعب</th>
                <th class="p-3">الفريق</th>
                <th class="p-3 text-center">⚽ الأهداف</th>
                <th class="p-3 text-center">🎯 الأسيست</th>
                <th class="p-3 text-center">🟨 صفراء</th>
                <th class="p-3 text-center">🟥 حمراء</th>
              </tr>
            </thead>
            <tbody id="scorers-list" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 4. تبويب اللاعبين -->
    <div id="players-tab" class="tab-content hidden">
      <div class="bg-white rounded-xl shadow overflow-hidden p-4">
        <div class="bg-blue-900 text-white p-4 font-bold text-lg text-center rounded-lg mb-4">قائمة جميع اللاعبين</div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-right">
            <thead class="bg-gray-100 text-gray-700">
              <tr>
                <th class="p-3">اللاعب</th>
                <th class="p-3">الفريق</th>
                <th class="p-3 text-center">المركز</th>
                <th class="p-3 text-center">الرقم</th>
                <th class="p-3 text-center">الجنسية</th>
              </tr>
            </thead>
            <tbody id="all-players-list" class="divide-y"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-tab'));
      document.getElementById(tabId).classList.remove('hidden');
      btn.classList.add('active-tab');
    }

    let rawMatchesData = [];

    // دالة لحساب العِداد التنازلي للوقت المتبقي للمباراة
    function updateCountdowns() {
      const now = new Date().getTime();

      rawMatchesData.forEach((m, idx) => {
        const matchTime = new Date(m.date).getTime();
        const diff = matchTime - now;

        const container = document.getElementById(`countdown-${idx}`);
        if (!container) return;

        if (m.completed) {
          container.innerHTML = `
            <div class="bg-blue-900 text-white font-bold px-4 py-2 rounded-xl text-lg shadow">
              ${m.hs} : ${m.as}
            </div>`;
        } else if (diff > 0) {
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          container.innerHTML = `
            <div class="flex items-center gap-2">
              <div class="bg-blue-900 text-white p-2 rounded-lg text-center w-14">
                <div class="text-base font-bold">${String(seconds).padStart(2, '0')}</div>
                <div class="text-[10px] text-gray-200">ثانية</div>
              </div>
              <span class="font-bold text-blue-900">:</span>
              <div class="bg-blue-900 text-white p-2 rounded-lg text-center w-14">
                <div class="text-base font-bold">${String(minutes).padStart(2, '0')}</div>
                <div class="text-[10px] text-gray-200">دقيقة</div>
              </div>
              <span class="font-bold text-blue-900">:</span>
              <div class="bg-blue-900 text-white p-2 rounded-lg text-center w-14">
                <div class="text-base font-bold">${String(hours).padStart(2, '0')}</div>
                <div class="text-[10px] text-gray-200">ساعة</div>
              </div>
            </div>`;
        } else {
          container.innerHTML = `
            <div class="bg-red-600 text-white font-bold px-4 py-2 rounded-xl text-sm shadow animate-pulse">
              جارية الآن ⚽
            </div>`;
        }
      });
    }

    // 1. جلب الترتيب
    fetch('data/standings.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('standings-list').innerHTML = data.map(s => `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-bold">${s.r}</td>
            <td class="p-3 font-semibold text-blue-900">${s.t}</td>
            <td class="p-3 text-center">${s.p}</td>
            <td class="p-3 text-center">${s.w}</td>
            <td class="p-3 text-center">${s.d}</td>
            <td class="p-3 text-center">${s.l}</td>
            <td class="p-3 text-center">${s.gf}</td>
            <td class="p-3 text-center">${s.ga}</td>
            <td class="p-3 text-center">${s.gd}</td>
            <td class="p-3 text-center font-bold text-blue-900">${s.pts}</td>
          </tr>
        `).join('');
      }).catch(e => console.error(e));

    // 2. جلب المباريات وعرض العداد التنازلي
    fetch('data/matches.json')
      .then(r => r.json())
      .then(data => {
        rawMatchesData = data;
        
        document.getElementById('matches-list').innerHTML = data.map((m, idx) => {
          const matchDate = new Date(m.date);
          const dateStr = matchDate.toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
          const timeStr = matchDate.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="bg-white border rounded-xl p-4 shadow-sm relative">
              <div class="flex justify-between items-center text-xs text-gray-400 mb-3 px-2">
                <span class="bg-blue-50 text-blue-800 px-2 py-1 rounded-md font-semibold">⏱️ ${timeStr}</span>
                <span>${dateStr}</span>
              </div>

              <div class="flex items-center justify-between gap-2 px-4 py-2">
                <!-- الفريق المستضيف -->
                <div class="flex flex-col items-center w-1/3">
                  <span class="font-bold text-blue-900 text-center text-base">${m.home}</span>
                </div>

                <!-- عداد الوقت التنازلي -->
                <div id="countdown-${idx}" class="flex justify-center items-center w-1/3">
                  <!-- محتوى العداد التنازلي يولد تلقائياً -->
                </div>

                <!-- الفريق الضيف -->
                <div class="flex flex-col items-center w-1/3">
                  <span class="font-bold text-blue-900 text-center text-base">${m.away}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        updateCountdowns();
        setInterval(updateCountdowns, 1000);
      }).catch(e => console.error(e));

    // 3. جلب اللاعبين والهدافين
    fetch('data/players.json')
      .then(r => r.json())
      .then(players => {
        const topScorers = players
          .filter(p => (p.goals || 0) > 0 || (p.assists || 0) > 0)
          .sort((a, b) => b.goals - a.goals || b.assists - a.assists)
          .slice(0, 30);

        document.getElementById('scorers-list').innerHTML = topScorers.map((p, index) => `
          <tr class="hover:bg-gray-50 transition">
            <td class="p-3 font-bold text-gray-500">${index + 1}</td>
            <td class="p-3 font-semibold text-blue-900">${p.name}</td>
            <td class="p-3 text-gray-600">${p.team}</td>
            <td class="p-3 text-center font-bold text-green-600 text-base">${p.goals || 0}</td>
            <td class="p-3 text-center text-gray-700">${p.assists || 0}</td>
            <td class="p-3 text-center text-yellow-600">${p.yellowCards || 0}</td>
            <td class="p-3 text-center text-red-600">${p.redCards || 0}</td>
          </tr>
        `).join('');

        document.getElementById('all-players-list').innerHTML = players.slice(0, 50).map(p => `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-semibold text-blue-900">${p.name}</td>
            <td class="p-3">${p.team}</td>
            <td class="p-3 text-center">${p.position || '-'}</td>
            <td class="p-3 text-center">${p.number || '-'}</td>
            <td class="p-3 text-center">${p.nationality || '-'}</td>
          </tr>
        `).join('');
      }).catch(e => console.error(e));
  </script>
</body>
</html>
